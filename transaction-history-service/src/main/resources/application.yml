server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: transaction-history-service
  datasource:
    url: jdbc:postgresql://localhost:5434/history_db
    username: history_user
    password: history_pass
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: history-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.fintech.common.event

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  api:
    secret: ${INTERNAL_API_SECRET:dev-internal-secret-for-local-only}

transaction-history:
  default-page-size: 20
  max-date-range-months: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: transaction-history-service
