global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'discovery-server'
    metrics_path: /actuator/prometheus
    basic_auth:
      username: eureka
      password: password
    static_configs:
      - targets: ['discovery-server-1:8761', 'discovery-server-2:8761']

  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'account-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['account-service:8081']

  - job_name: 'transfer-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['transfer-service:8082']

  - job_name: 'transaction-history-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['transaction-history-service:8083']
