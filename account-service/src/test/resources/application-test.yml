spring:
  datasource:
    # Overridden at runtime by @DynamicPropertySource in Testcontainers tests
    url: jdbc:postgresql://localhost:5432/account_test
    username: test
    password: test
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    # Not used in integration tests — Testcontainers overrides datasource but not Kafka.
    # Kafka listeners are disabled via @SpringBootTest slice or auto-configuration exclusion.
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: account-service-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.fintech.common.event

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: test-jwt-secret-key-for-unit-and-integration-tests-only-256-bits-long
  access-token-expiry: 900000
  refresh-token-expiry: 604800000

internal:
  api:
    secret: test-internal-api-secret-for-tests-only

management:
  tracing:
    sampling:
      probability: 0.0

logging:
  level:
    com.fintech: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.apache.kafka: WARN
    org.flywaydb: INFO
