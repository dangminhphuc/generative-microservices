server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: transfer-service
  datasource:
    url: jdbc:postgresql://localhost:5433/transfer_db
    username: transfer_user
    password: transfer_pass
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: transfer-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.fintech.common.event

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

account-service:
  url: http://account-service
  timeout: 5000

transfer:
  daily-limit: 500000000
  minimum-amount: 1000

internal:
  api:
    secret: ${INTERNAL_API_SECRET:dev-internal-secret-for-local-only}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: transfer-service
