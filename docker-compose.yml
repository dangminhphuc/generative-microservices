services:

  # --- Infrastructure ---

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  account-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: account_pass
    ports:
      - "5432:5432"
    volumes:
      - account-db-data:/var/lib/postgresql/data
    networks:
      - internal

  transfer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transfer_db
      POSTGRES_USER: transfer_user
      POSTGRES_PASSWORD: transfer_pass
    ports:
      - "5433:5432"
    volumes:
      - transfer-db-data:/var/lib/postgresql/data
    networks:
      - internal

  history-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: history_db
      POSTGRES_USER: history_user
      POSTGRES_PASSWORD: history_pass
    ports:
      - "5434:5432"
    volumes:
      - history-db-data:/var/lib/postgresql/data
    networks:
      - internal

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - internal

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - internal

  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    environment:
      EUREKA_USERNAME: ${EUREKA_USERNAME:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?EUREKA_PASSWORD must be set}
    volumes:
      - ./infra/prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        envsubst < /etc/prometheus/prometheus.yml.template > /etc/prometheus/prometheus.yml
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    networks:
      - internal

  # --- Services ---

  discovery-server-1:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_INSTANCE_HOSTNAME: discovery-server-1
      EUREKA_USERNAME: ${EUREKA_USERNAME:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?EUREKA_PASSWORD must be set}
      EUREKA_PEER_URLS: http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-2:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - internal

  discovery-server-2:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8762:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_INSTANCE_HOSTNAME: discovery-server-2
      EUREKA_USERNAME: ${EUREKA_USERNAME:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?EUREKA_PASSWORD must be set}
      EUREKA_PEER_URLS: http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-1:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - internal

  api-gateway-1:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      discovery-server-1:
        condition: service_healthy
      discovery-server-2:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_HOSTNAME: api-gateway-1
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-1:8761/eureka/,http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-2:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GATEWAY_INTERNAL_SECRET: ${INTERNAL_API_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - public
      - internal

  api-gateway-2:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8090:8080"
    depends_on:
      discovery-server-1:
        condition: service_healthy
      discovery-server-2:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_HOSTNAME: api-gateway-2
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-1:8761/eureka/,http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-2:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GATEWAY_INTERNAL_SECRET: ${INTERNAL_API_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - public
      - internal

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    depends_on:
      discovery-server-1:
        condition: service_healthy
      discovery-server-2:
        condition: service_healthy
      account-db:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://account-db:5432/account_db
      SPRING_DATASOURCE_USERNAME: account_user
      SPRING_DATASOURCE_PASSWORD: account_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-1:8761/eureka/,http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-2:8761/eureka/
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-change-me-in-production}
      ZIPKIN_URL: http://zipkin:9411
    networks:
      - internal

  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    depends_on:
      discovery-server-1:
        condition: service_healthy
      discovery-server-2:
        condition: service_healthy
      transfer-db:
        condition: service_started
      kafka:
        condition: service_started
      account-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://transfer-db:5432/transfer_db
      SPRING_DATASOURCE_USERNAME: transfer_user
      SPRING_DATASOURCE_PASSWORD: transfer_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-1:8761/eureka/,http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-2:8761/eureka/
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-change-me-in-production}
    networks:
      - internal

  transaction-history-service:
    build:
      context: .
      dockerfile: transaction-history-service/Dockerfile
    depends_on:
      discovery-server-1:
        condition: service_healthy
      discovery-server-2:
        condition: service_healthy
      history-db:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://history-db:5432/history_db
      SPRING_DATASOURCE_USERNAME: history_user
      SPRING_DATASOURCE_PASSWORD: history_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-1:8761/eureka/,http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD}@discovery-server-2:8761/eureka/
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-change-me-in-production}
    networks:
      - internal

volumes:
  account-db-data:
  transfer-db-data:
  history-db-data:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
